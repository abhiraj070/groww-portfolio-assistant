[project]
name = "groww-portfolio-assistant"
version = "0.1.0"
description = "Read-only personal Groww portfolio backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.9,<5",
    "fastapi>=0.115,<1",
    "growwapi==1.5.0",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyotp>=2.9,<3",
    "requests>=2.32,<3",
    "tzdata>=2025.2",
    "python-dotenv>=1,<2",
    "uvicorn>=0.34,<1",
    "mcp==2.3.0",
    "jsonschema>=4.20,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
